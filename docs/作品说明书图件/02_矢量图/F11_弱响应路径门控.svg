   <g id="text_4">
    <text style="fill: #20272e; font: 7px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="345.827678" y="80.587605" transform="rotate(-0 345.827678 80.587605)">路径支撑比例足够</text>
