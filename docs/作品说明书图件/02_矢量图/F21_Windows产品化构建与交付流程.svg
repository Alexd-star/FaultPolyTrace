   <g id="text_2">
    <text style="fill: #20272e; font: 7px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(106.512793 115.480417)">构建 CLI / 桌面软件</text>
    <text style="fill: #20272e; font: 7px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(95.792949 124.774667)">Launcher / Runner / 插件</text>
   </g>
   <g id="text_3">
    <text style="fill: #20272e; font: 7px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="218.240198" y="120.127542" transform="rotate(-0 218.240198 120.127542)">自动测试与哈希核对</text>
   </g>
   <g id="text_4">
    <text style="fill: #20272e; font: 7px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(281.699322 115.480417)">生成安装器</text>
    <text style="fill: #20272e; font: 7px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(271.756041 124.774667)">便携 ZIP / 插件包</text>
   </g>
   <g id="text_5">
    <text style="fill: #20272e; font: 7px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="380.158446" y="120.127542" transform="rotate(-0 380.158446 120.127542)">异机与中文路径烟测</text>
   </g>
   <g id="text_6">
    <text style="fill: #20272e; font: 7px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="461.11757" y="120.127542" transform="rotate(-0 461.11757 120.127542)">形成唯一交付清单</text>
   </g>
   <g id="text_7">
    <text style="fill: #5c6873; font: 700 6.5px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="29.164775" y="208.709604" transform="rotate(-0 29.164775 208.709604)">一致性约束</text>
   </g>
   <g id="text_8">
    <text style="font: 6.5px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="33.263971" y="228.095626" transform="rotate(-0 33.263971 228.095626)">源码提交、编译时间、Build ID、EXE 哈希和包哈希可追溯</text>
   </g>
   <g id="text_9">
    <text style="font: 6.5px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="33.263971" y="245.447597" transform="rotate(-0 33.263971 245.447597)">禁止混入旧版 EXE、个人配置、开发缓存和历史发布目录</text>
   </g>
   <g id="text_10">
    <text style="fill: #5c6873; font: 700 6.5px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="285.364535" y="208.709604" transform="rotate(-0 285.364535 208.709604)">客户机约束</text>
   </g>
   <g id="text_11">
    <text style="font: 6.5px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="289.463731" y="228.095626" transform="rotate(-0 289.463731 228.095626)">安装目录不写配置；用户数据进入 LocalAppData / 文档目录</text>
   </g>
   <g id="text_12">
    <text style="font: 6.5px 'Microsoft YaHei', 'SimHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="289.463731" y="245.447597" transform="rotate(-0 289.463731 245.447597)">Qt、VC、平台插件、示例、模板和帮助文档完整随包</text>
   </g>
